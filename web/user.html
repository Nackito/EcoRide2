<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EcoRide - Utilisateur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="p-4">
    <nav class="navbar navbar-expand navbar-light bg-light mb-3">
      <div class="container-fluid">
        <span class="navbar-brand">EcoRide — Utilisateur</span>
        <div class="d-flex">
          <a href="/index.html" class="btn btn-link btn-sm me-2">Accueil</a>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">
            Déconnexion
          </button>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card card-body">
            <h5>Modes</h5>
            <form id="modesForm">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="is_driver"
                />
                <label class="form-check-label" for="is_driver"
                  >Chauffeur</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="is_passenger"
                />
                <label class="form-check-label" for="is_passenger"
                  >Passager</label
                >
              </div>
              <button class="btn btn-primary mt-2">Enregistrer</button>
            </form>
            <div id="modesMsg" class="mt-2"></div>
          </div>

          <div class="card card-body mt-3">
            <h5>Préférences</h5>
            <form id="prefsForm">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="smoker_allowed"
                />
                <label class="form-check-label" for="smoker_allowed"
                  >Fumeur autorisé</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="pets_allowed"
                />
                <label class="form-check-label" for="pets_allowed"
                  >Animaux autorisés</label
                >
              </div>
              <textarea
                id="extra"
                class="form-control mt-2"
                placeholder="Autres préférences (une par ligne)"
              ></textarea>
              <button class="btn btn-primary mt-2">Enregistrer</button>
            </form>
            <div id="prefsMsg" class="mt-2"></div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card card-body">
            <h5>Véhicules</h5>
            <form id="vehForm">
              <input
                class="form-control mb-2"
                id="plaque"
                placeholder="Plaque"
              />
              <input
                class="form-control mb-2"
                id="date_immatriculation"
                placeholder="Date 1ère immatriculation (YYYY-MM-DD)"
              />
              <input
                class="form-control mb-2"
                id="marque"
                placeholder="Marque"
              />
              <input
                class="form-control mb-2"
                id="modele"
                placeholder="Modèle"
              />
              <input
                class="form-control mb-2"
                id="couleur"
                placeholder="Couleur"
              />
              <button class="btn btn-primary">Ajouter</button>
            </form>
            <ul id="vehList" class="list-group mt-2"></ul>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card card-body">
            <h5>Créer un covoiturage</h5>
            <form id="tripForm">
              <input
                class="form-control mb-2"
                id="lieu_depart"
                placeholder="Adresse départ"
              />
              <input
                class="form-control mb-2"
                id="lieu_arrivee"
                placeholder="Adresse arrivée"
              />
              <input
                class="form-control mb-2"
                id="date_depart"
                placeholder="Date départ (YYYY-MM-DD)"
              />
              <input
                class="form-control mb-2"
                id="heure_depart"
                placeholder="Heure départ (HH:MM)"
              />
              <input
                class="form-control mb-2"
                id="date_arrivee"
                placeholder="Date arrivée (YYYY-MM-DD)"
              />
              <input
                class="form-control mb-2"
                id="heure_arrivee"
                placeholder="Heure arrivée (HH:MM)"
              />
              <input
                class="form-control mb-2"
                id="nb_place"
                type="number"
                placeholder="Places dispo"
              />
              <input
                class="form-control mb-2"
                id="prix_personne"
                type="number"
                step="0.5"
                placeholder="Prix par personne (€)"
              />
              <select class="form-select mb-2" id="vehicule_id"></select>
              <button class="btn btn-success">Publier</button>
            </form>
            <div id="tripMsg" class="mt-2"></div>
          </div>

          <div class="card card-body mt-3">
            <h5>Historique</h5>
            <ul id="histList" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      const api = location.origin;
      const token = localStorage.getItem("token");
      if (!token) location = "/login.html";

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        location = "/login.html";
      });

      async function fetchJSON(url, opts = {}) {
        const res = await fetch(url, {
          ...opts,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
            ...(opts.headers || {}),
          },
        });
        const ct = res.headers.get("content-type") || "";
        const data = ct.includes("application/json")
          ? await res.json()
          : await res.text();
        if (!res.ok) throw new Error((data && data.error) || data || "Erreur");
        return data;
      }

      async function loadModes() {
        const m = await fetchJSON(api + "/user/modes");
        document.getElementById("is_driver").checked = !!m.is_driver;
        document.getElementById("is_passenger").checked = !!m.is_passenger;
      }
      document
        .getElementById("modesForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            await fetchJSON(api + "/user/modes", {
              method: "PUT",
              body: JSON.stringify({
                is_driver: document.getElementById("is_driver").checked,
                is_passenger: document.getElementById("is_passenger").checked,
              }),
            });
            document.getElementById("modesMsg").textContent =
              "Modes enregistrés";
          } catch (err) {
            document.getElementById("modesMsg").textContent = err.message;
          }
        });

      async function loadPrefs() {
        const p = await fetchJSON(api + "/user/preferences");
        document.getElementById("smoker_allowed").checked = !!p.smoker_allowed;
        document.getElementById("pets_allowed").checked = !!p.pets_allowed;
        document.getElementById("extra").value = p.extra || "";
      }
      document
        .getElementById("prefsForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            await fetchJSON(api + "/user/preferences", {
              method: "PUT",
              body: JSON.stringify({
                smoker_allowed:
                  document.getElementById("smoker_allowed").checked,
                pets_allowed: document.getElementById("pets_allowed").checked,
                extra: document.getElementById("extra").value,
              }),
            });
            document.getElementById("prefsMsg").textContent =
              "Préférences enregistrées";
          } catch (err) {
            document.getElementById("prefsMsg").textContent = err.message;
          }
        });

      async function loadVehicles() {
        const list = document.getElementById("vehList");
        list.innerHTML = "";
        const rows = await fetchJSON(api + "/user/vehicles");
        const select = document.getElementById("vehicule_id");
        select.innerHTML = "";
        rows.forEach((v) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = `${v.plaque} — ${v.marque || ""} ${v.modele || ""} ${v.couleur || ""}`;
          list.appendChild(li);
          const opt = document.createElement("option");
          opt.value = v.id;
          opt.textContent = `${v.plaque} (${v.marque || "?"})`;
          select.appendChild(opt);
        });
      }
      document
        .getElementById("vehForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector("button");
          btn.disabled = true;
          try {
            await fetchJSON(api + "/user/vehicles", {
              method: "POST",
              body: JSON.stringify({
                plaque: document.getElementById("plaque").value,
                date_immatriculation: document.getElementById(
                  "date_immatriculation",
                ).value,
                marque: document.getElementById("marque").value,
                modele: document.getElementById("modele").value,
                couleur: document.getElementById("couleur").value,
              }),
            });
            await loadVehicles();
          } catch (err) {
            alert(err.message);
          } finally {
            btn.disabled = false;
          }
        });

      async function loadHistory() {
        const list = document.getElementById("histList");
        list.innerHTML = "";
        const rows = await fetchJSON(api + "/user/trips/history");
        rows.forEach((c) => {
          const li = document.createElement("li");
          li.className =
            "list-group-item d-flex justify-content-between align-items-center";
          li.innerHTML = `<div>#${c.id} ${c.date_depart} ${c.heure_depart} ${c.lieu_depart} -> ${c.lieu_arrivee} — statut: ${c.statut} — role: ${c.role}</div>`;
          const btns = document.createElement("div");
          if (c.role === "driver") {
            const start = document.createElement("button");
            start.className = "btn btn-outline-primary btn-sm me-2";
            start.textContent = "Démarrer";
            start.onclick = async () => {
              await fetchJSON(api + "/user/trips/" + c.id + "/start", {
                method: "POST",
              });
              loadHistory();
            };
            const finish = document.createElement("button");
            finish.className = "btn btn-success btn-sm me-2";
            finish.textContent = "Arrivée";
            finish.onclick = async () => {
              await fetchJSON(api + "/user/trips/" + c.id + "/finish", {
                method: "POST",
              });
              loadHistory();
            };
            btns.append(start, finish);
          }
          const cancel = document.createElement("button");
          cancel.className = "btn btn-outline-danger btn-sm";
          cancel.textContent = "Annuler";
          cancel.onclick = async () => {
            await fetchJSON(api + "/user/trips/" + c.id + "/cancel", {
              method: "POST",
            });
            loadHistory();
          };
          btns.append(cancel);
          li.appendChild(btns);
          list.appendChild(li);
        });
      }

      document
        .getElementById("tripForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector("button");
          btn.disabled = true;
          try {
            await fetchJSON(api + "/user/trips", {
              method: "POST",
              body: JSON.stringify({
                lieu_depart: document.getElementById("lieu_depart").value,
                lieu_arrivee: document.getElementById("lieu_arrivee").value,
                date_depart: document.getElementById("date_depart").value,
                heure_depart: document.getElementById("heure_depart").value,
                date_arrivee: document.getElementById("date_arrivee").value,
                heure_arrivee: document.getElementById("heure_arrivee").value,
                nb_place: document.getElementById("nb_place").value,
                prix_personne: document.getElementById("prix_personne").value,
                vehicule_id: document.getElementById("vehicule_id").value,
              }),
            });
            document.getElementById("tripMsg").textContent = "Trajet créé";
            await loadHistory();
          } catch (err) {
            document.getElementById("tripMsg").textContent = err.message;
          } finally {
            btn.disabled = false;
          }
        });

      (async function init() {
        await loadModes();
        await loadPrefs();
        await loadVehicles();
        await loadHistory();
      })();
    </script>
  </body>
</html>
